# Маршрут, которым управляет Argo Rollouts: веса переставляет контроллер.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments
  namespace: prod
spec:
  parentRefs: [{ name: prod-gateway }]
  hostnames: [payments.example.com]
  rules:
  # A/B: явный сегмент по заголовку. Правило с match проверяется раньше весового.
  - matches:
    - headers: [{ name: x-beta-user, value: "true" }]
    backendRefs: [{ name: payments-canary, port: 80 }]
  # Канарейка: веса — это доли от суммы, а не проценты. По умолчанию weight = 1.
  - backendRefs:
    - { name: payments-stable, port: 80, weight: 100 }
    - { name: payments-canary, port: 80, weight: 0 }
