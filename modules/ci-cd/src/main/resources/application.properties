spring.application.name=payments

# Конфигурация приходит из окружения, а не зашивается в образ.
# PAYMENTS_ENVIRONMENT и PAYMENTS_BUILD_DIGEST подставляет платформа раскатки:
# values-<env>.yaml для Helm, overlay для Kustomize, environment для Swarm.
payments.environment=${PAYMENTS_ENVIRONMENT:local}
payments.build-digest=${PAYMENTS_BUILD_DIGEST:unknown}

# Пробы для K8s и Swarm: /actuator/health/liveness и /readiness.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
